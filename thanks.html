<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inquiry Received | SeaSide Travels</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), 
                        url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            font-family: 'Arial', sans-serif;
            color: white;
            text-align: center;
        }
        .message-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            max-width: 500px;
        }
        h1 { font-size: 2.5rem; margin-bottom: 15px; }
        p { font-size: 1.1rem; margin-bottom: 30px; line-height: 1.6; }
        .back-btn {
            text-decoration: none;
            background: #00d2ff;
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
            display: inline-block;
        }
        .back-btn:hover {
            background: #00b8e6;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.3);
        }
    </style>
</head>
<body>

    <div class="message-box">
        <h1>🌴 Thank You!</h1>
        <p>Your inquiry for SeaSide Travels has been received. One of our experts will contact you shortly to plan your dream escape.</p>
        <a href="index.html" class="back-btn">Return Home</a>
    </div>

</body>
</html>
